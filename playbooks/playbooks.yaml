# FortiSIEM v2 connector sample playbooks.
#
# Most of these cover manual investigation, response, and utility operations.
# The last three are the Data Ingestion Wizard chain (Init Macros / Fetch /
# Ingest) -- see the block comment above them.
#
# Build with `python playbooks/build.py`, never by hand: the compiled JSON
# carries wizard-contract fields (exported_tags, _configuration_schema, the
# Ingest trigger's route/resources) that this YAML dialect cannot express.
#
# connectors: fortinet-fortisiemv2 (swap the config for your appliance)

collection: Sample - Fortinet FortiSIEM v2 - 6.0.0
description: >-
  Sample playbooks for the "Fortinet FortiSIEM v2" connector. If you are planning
  to use any of the sample playbooks in your environment, ensure that you clone
  those playbooks and move them to a different collection, since the sample
  playbook collection gets deleted during connector upgrade and delete.
visible: true
# The Data Ingestion Wizard discovers a connector's sample collection by
# filtering `/api/3/workflow_collections` on `recordTags=dataingestion` -- so
# the ingestion tags must live in the collection's `recordTags` (and each
# ingestion playbook's `recordTags`), not just in `exported_tags` (which is
# only the export's top-level metadata and is never queried by the wizard).
tags:
  - fortinet-fortisiemv2
  - Fortinet
  - dataingestion
exported_tags:
  - fortinet-fortisiemv2
  - Fortinet
  - dataingestion
  - fetch
  - create
  - ingest
playbooks:


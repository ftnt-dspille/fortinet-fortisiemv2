# ---------------------------------------------------------------------------
# Data ingestion chain (Init Macros / Fetch / Ingest)
#
# Modeled on the shipping FortiSIEM v1 connector's ingestion playbooks, which
# is the shape the Data Ingestion Wizard expects:
#
#   * the wizard discovers these three by their tags -- every one carries
#     #dataingestion, and Fetch/Ingest additionally carry #fetch / #ingest;
#   * Fetch's Start step carries `_configuration_schema`, the JSON that
#     renders the wizard's configuration form;
#   * Fetch ends in a set_variable ("Save Result") publishing `data` plus the
#     carry-through vars -- Ingest reads them back off the workflow_reference
#     step ("List Incident") as `vars.steps.List_Incident.<key>`;
#   * the incremental-pull watermark lives in a per-playbook dynamic variable
#     (macro) that Init Macros creates, Fetch reads, and Ingest advances.
#
# Unlike v1 there is no async per-alert event-enrichment child workflow --
# `ingest_incidents` already returns triggering events inline on each record.
# ---------------------------------------------------------------------------

- name: '>> FortiSIEM v2 > Init Macros'
  description: >-
    Creates the FortiSIEM last-pull-time macro if it does not already exist.
    Called by Fetch during the wizard's environment-setup pass.
  tags:
  - fortinet-fortisiemv2
  - dataingestion
  is_active: true
  parameters:
  - FortiSIEMMacroName
  - FortiSIEMMacroValue
  - overrideIfNoMatch
  steps:
  - name: Start
    type: start
    next: Get FortiSIEM Macros

  - name: Get FortiSIEM Macros
    type: connector
    connector: cyops_utilities
    operation: make_cyops_request
    config: ''
    params:
      iri: /api/wf/api/dynamic-variable/?format=json&name={{vars.input.params.FortiSIEMMacroName}}
      body: ''
      method: GET
    next: FortiSIEM Macro Exists

  - name: FortiSIEM Macro Exists
    type: decision
    conditions:
    - display: Not Exist
      when: "{{ vars.steps.Get_FortiSIEM_Macros.data['hydra:totalItems'] == 0 }}"
      next: Create FortiSIEM Macro
    - display: Exist
      default: true
      next: Fetch Macro Current Value

  - name: Create FortiSIEM Macro
    type: connector
    connector: cyops_utilities
    operation: make_cyops_request
    config: ''
    params:
      iri: /api/wf/api/dynamic-variable/?format=json
      body: "{ 'name': '{{vars.input.params.FortiSIEMMacroName}}', 'value': '{{vars.input.params.FortiSIEMMacroValue}}' }"
      method: POST

  - name: Fetch Macro Current Value
    type: set_variable
    vars:
      macroExistingRecord: "{{vars.steps.Get_FortiSIEM_Macros.data['hydra:member'][0]}}"
    next: Update Macro If Required

  - name: Update Macro If Required
    type: connector
    when: "{{ (vars.input.params.overrideIfNoMatch == true) and (vars.macroExistingRecord.value != vars.input.params.FortiSIEMMacroValue) }}"
    connector: cyops_utilities
    operation: make_cyops_request
    config: ''
    params:
      iri: /api/wf/api/dynamic-variable/{{ vars.macroExistingRecord.id }}/
      body: "{ 'name': '{{vars.input.params.FortiSIEMMacroName}}', 'value': '{{vars.input.params.FortiSIEMMacroValue}}' }"
      method: PUT

- name: '> FortiSIEM v2 > Fetch'
  description: >-
    Reads the last-pull-time watermark and fetches FortiSIEM incidents since
    then, already mapped to FortiSOAR alert shape with triggering events.
  tags:
  - fortinet-fortisiemv2
  - fetch
  - dataingestion
  is_active: true
  steps:
  - name: Start
    type: start
    configuration_schema:
    - title: Fetch Mode
      required: true
      editable: true
      visible: true
      type: select
      name: fetch_mode
      options:
      - By Updates In Last X Minutes
      - By Sample Incident ID
      onchange:
        By Updates In Last X Minutes:
        - title: Pull Incidents Created/Updated In Last X Minutes
          name: minutes
          type: text
          required: true
          editable: true
          visible: true
          value: 60
          tooltip: Cold-start lookback used on the first run, before a last-pull-time watermark exists. e.g. 60
        - title: Incident Status
          name: incidentStatus
          type: multiselect
          required: false
          editable: true
          visible: true
          value:
          - Active
          options:
          - Active
          - Auto Cleared
          - Manually Cleared
          - System Cleared
        - title: Severity
          name: severity
          type: multiselect
          required: false
          editable: true
          visible: true
          value:
          - High
          - Medium
          - Low
          options:
          - High
          - Medium
          - Low
        - title: Incident Category
          name: incidentCategory
          type: multiselect
          required: false
          editable: true
          visible: true
          options:
          - Availability
          - Performance
          - Change
          - Security
          - Other
        - title: Incidents Per Page
          name: size
          type: text
          required: false
          editable: true
          visible: true
          value: 100
          tooltip: Page size for the incident query. The run pages through the whole window, so this tunes request batching -- it is not a cap on incidents ingested.
        - title: Fetch Triggering Events
          name: include_events
          type: checkbox
          required: false
          editable: true
          visible: true
          value: true
          tooltip: Enrich each incident with its triggering events. Adds roughly one FortiSIEM query per incident.
        - title: Maximum Events To Pull Per Incident
          name: event_count
          type: text
          required: false
          editable: true
          visible: true
          value: 5
        By Sample Incident ID:
        - title: Incident ID
          name: incidentId
          type: text
          required: true
          editable: true
          visible: true
          tooltip: Incident ID to use for building the field mapping
        - title: From
          name: from
          type: datetime
          required: false
          editable: true
          visible: true
        - title: To
          name: to
          type: datetime
          required: false
          editable: true
          visible: true
    next: Configuration

  - name: Configuration
    type: set_variable
    comment: |
      Wizard-editable defaults. `minutes` is the cold-start lookback used the
      first time this ingestion runs (macro still '0'); the default is 60 (an
      hour back from now). After the first run the macro supplies the window.
      The macro name is scoped to this playbook's UUID so two ingestion
      configurations never share a watermark.
    vars:
      minutes: '60'
      size: 100
      event_count: 5
      include_events: true
      use_query_lifecycle: false
      incidentStatus:
      - Active
      incidentCategory: []
      severity:
      - High
      - Medium
      - Low
      FortiSIEMMacroName: "FortiSIEMLastPullTime_{{vars['audit_info']['cyops_playbook_iri'].split('/')[-1].replace('-','_')}}"
    next: Get Macro Value

  - name: Get Macro Value
    type: connector
    connector: cyops_utilities
    operation: make_cyops_request
    config: ''
    params:
      iri: /api/wf/api/dynamic-variable/?format=json&name={{vars.FortiSIEMMacroName}}
      body: ''
      method: GET
    next: Environment Setup

  - name: Environment Setup
    type: workflow_reference
    comment: |
      Runs when the watermark macro does not exist yet -- not only on the
      wizard's `vars.request.env_setup` first pass.

      Keying solely off env_setup left ingestion permanently broken whenever
      the macro was missing: `Update Last Alert Pull Time` only *updates*, it
      does not create, so every run cold-started at `minutes` and the watermark
      was never written. Live-verified on 8.0.0: 100 scheduled runs, all
      `finished`, zero alerts created and no macro on the appliance -- a
      silent failure, because nothing errors.

      This step must therefore come AFTER Get Macro Value, so its absence can
      be seen. The macro is primed to '0', which Set Time Configuration reads
      as "cold start" for this one run.
    when: '{{ vars.request.env_setup or not vars.steps.Get_Macro_Value.data["hydra:member"] }}'
    target: '>> FortiSIEM v2 > Init Macros'
    FortiSIEMMacroName: '{{vars.FortiSIEMMacroName}}'
    FortiSIEMMacroValue: '0'
    overrideIfNoMatch: 'false'
    apply_async: false
    pass_parent_env: false
    pass_input_record: false
    next: Set Time Configuration

  - name: Set Time Configuration
    type: set_variable
    comment: |
      `curr_timestamp` is captured before the fetch and only written back to
      the macro after Ingest succeeds, so a failed run re-pulls its window
      instead of silently skipping it.
    vars:
      curr_timestamp: "{{ arrow.utcnow().format('YYYY-MM-DDTHH:mm:ss') }}Z"
      last_pull_time: "{% if not vars.steps.Get_Macro_Value.data['hydra:member'] or vars.steps.Get_Macro_Value.data['hydra:member'][0].value == '0' or vars.request.env_setup %}{{ arrow.utcnow().shift(minutes=-(vars.minutes | int)).format('YYYY-MM-DDTHH:mm:ss') }}Z{% else %}{{ vars.steps.Get_Macro_Value.data['hydra:member'][0].value }}{% endif %}"
    # The Data Ingestion Wizard's prepareFetchSampleConfig reads a step whose
    # name (case-insensitive) is exactly "fetch" to load the fetch operation +
    # params for the sample-data fetch, so the step is named "Fetch".
    next: Fetch

  - name: Fetch
    type: connector
    connector: fortinet-fortisiemv2
    operation: ingest_incidents
    operationTitle: Ingest Incidents
    config: ''
    params:
      from: '{{vars.last_pull_time}}'
      to: '{{vars.curr_timestamp}}'
      incidentStatus: '{{vars.incidentStatus}}'
      incidentCategory: '{{vars.incidentCategory}}'
      severity: '{{vars.severity}}'
      include_events: '{{vars.include_events}}'
      event_count: '{{vars.event_count}}'
      size: '{{vars.size}}'
      use_query_lifecycle: '{{vars.use_query_lifecycle}}'
    next: Save Result

  - name: Save Result
    type: set_variable
    comment: |
      The Fetch -> Ingest contract. Ingest reads every one of these back off
      the workflow_reference step ("List Incident") as `vars.steps.List_Incident.<key>`.
    vars:
      data: '{{vars.steps.Fetch.data}}'
      current_time: '{{vars.curr_timestamp}}'
      event_count: '{{vars.event_count}}'
      FortiSIEMMacroName: '{{vars.FortiSIEMMacroName}}'

- name: FortiSIEM v2 > Ingest
  description: >-
    Orchestrator: calls Fetch, then either returns a sample record for the
    wizard's Data Mapping preview (env_setup mode) or creates the alerts and
    advances the last-pull-time watermark.
  tags:
  - fortinet-fortisiemv2
  - ingest
  - dataingestion
  - create
  is_active: true
  steps:
  - name: Start
    type: start
    module: alerts
    button_label: 'FortiSIEM v2 > Ingest'
    requires_record: false
    next: List Incident

  - name: List Incident
    type: workflow_reference
    target: '> FortiSIEM v2 > Fetch'
    apply_async: false
    pass_parent_env: false
    pass_input_record: false
    next: Mapping Preview

  - name: Mapping Preview
    type: decision
    comment: |
      The Data Ingestion Wizard runs the Ingest playbook with
      `vars.request.env_setup == true` while the analyst designs the field
      mapping in the UI. In that mode we return the first fetched,
      already-mapped incident so the wizard can render the Data Mapping
      preview with real alert fields -- no alerts are written. `false` (or
      missing) is the real ingestion path.
    conditions:
    - display: Mapping Preview
      when: '{{ vars.request.env_setup | default(false) | bool }}'
      next: Return Sample
    - display: Ingest
      default: true
      next: Configuration

  - name: Return Sample
    type: set_variable
    comment: |
      The sample for the wizard's Data Mapping preview.
      `vars.steps.List_Incident.data[0]` is the first mapped incident from the
      Fetch window; its keys are the alert field names
      `field_mapping.map_incident_to_alert` emits (external_id, name, severity,
      source_ip, dest_ip, rule_name, mitre_* ...), which the wizard maps onto
      the alerts module. Falls back to a representative hardcoded record when
      the window is empty so the preview still renders.
    vars:
      sample: >-
        {% if vars.steps.List_Incident.data | default([]) | length > 0 %}
          {{ vars.steps.List_Incident.data[0] }}
        {% else %}
          {{ { 'name': 'Sample FortiSIEM Incident', 'external_id': '1800000000000000001', 'severity': 'Medium', 'alert_type': 'Other / Unknown', 'alert_state': 'Open', 'category': 'Security', 'subcategory': 'reconnaissance', 'source_ip': '192.168.5.25', 'dest_ip': '10.0.0.1', 'dest_port': 443, 'source_hostname': 'web01', 'target_user': 'admin', 'rule_name': 'Sample Rule', 'rule_description': 'Sample rule fired', 'alert_generation_epoch': 1790000000, 'last_observed_epoch': 1790000001, 'event_count': 1, 'mitre_technique_ids': ['T1046'], 'mitre_technique_names': ['Network Service Scanning'] } }}
        {% endif %}

  - name: Configuration
    type: set_variable
    comment: |
      Severity/status/type maps are keyed on the values `field_mapping.py` emits
      and cover every one of them -- an unmapped value would make `resolveRange`
      miss and the alert POST fail with a picklist 400. `field_mapping` clamps
      alert_type to VALID_ALERT_TYPES for exactly this reason, so the two lists
      have to be changed together.
    vars:
      incident_source_data: '{{ vars.steps.List_Incident.data }}'
      event_count: '{{ vars.steps.List_Incident.event_count }}'
      FortiSIEMMacroName: '{{ vars.steps.List_Incident.FortiSIEMMacroName }}'
      alerts_severity_map: "{'Minimal': {{'Severity'| picklist('Minimal')}}, 'Low': {{'Severity'| picklist('Low')}}, 'Medium': {{'Severity'| picklist('Medium')}}, 'High': {{'Severity'| picklist('High')}}, 'Critical': {{'Severity'| picklist('Critical')}}}"
      alerts_status_map: "{'Open': {{'AlertStatus'| picklist('Open')}}, 'Resolved': {{'AlertStatus'| picklist('Closed')}}, 'Closed': {{'AlertStatus'| picklist('Closed')}}}"
      alerts_type_map: "{'Actionable Threat Feeds': {{'AlertType'| picklist('Actionable Threat Feeds')}}, 'Brute Force Attempts': {{'AlertType'| picklist('Brute Force Attempts')}}, 'Command and Control': {{'AlertType'| picklist('Command and Control')}}, 'Concurrent Login': {{'AlertType'| picklist('Concurrent Login')}}, 'Data Exfiltration': {{'AlertType'| picklist('Data Exfiltration')}}, 'Denial of Service': {{'AlertType'| picklist('Denial of Service')}}, 'Lateral Movement': {{'AlertType'| picklist('Lateral Movement')}}, 'MITRE ATT&CK': {{'AlertType'| picklist('MITRE ATT&CK')}}, 'Malware': {{'AlertType'| picklist('Malware')}}, 'Other / Unknown': {{'AlertType'| picklist('Other / Unknown')}}, 'Phishing': {{'AlertType'| picklist('Phishing')}}, 'Policy Violation': {{'AlertType'| picklist('Policy Violation')}}, 'Ransomware': {{'AlertType'| picklist('Ransomware')}}, 'Reconnaissance': {{'AlertType'| picklist('Reconnaissance')}}}"
    # The step must be named "Create Record" (not e.g. "Create Alerts"): the
    # Data Ingestion Wizard's page check (`isStepAvailableInPlaybook`) shows the
    # Data Mapping page only when the create playbook has a step whose name is
    # exactly "create record", and it reads `arguments.collection` off that step
    # to detect the target module.
    next: Create Record

  - name: Create Record
    type: create_record
    module: alerts
    operation: Overwrite
    is_upsert: true
    comment: |
      `is_upsert` routes this at /api/3/upsert/alerts, keyed on `sourceId`, so a
      re-ingest updates the existing alert. Without it the plain insert path
      409s on the sourceid uniqueness constraint the moment a window overlaps a
      previous run -- which every incremental pull does.
    for_each:
      item: '{{ vars.incident_source_data }}'
      __bulk: true
      batch_size: 100
      condition: ''
    fields:
      name: '{{ vars.item.name }}'
      source: Fortinet FortiSIEM
      sourceId: '{{ vars.item.external_id }}'
      severity: '{{ vars.item.severity | resolveRange(vars.alerts_severity_map) }}'
      alert_state: '{{ "AlertState" | picklist("New") }}'
      status: '{{ vars.item.alert_state | resolveRange(vars.alerts_status_map) }}'
      type: '{{ vars.item.alert_type | resolveRange(vars.alerts_type_map) }}'
      # Without these the alert carries only its ingest time, so the grid sorts
      # and the SLA clocks run on when FortiSOAR happened to poll rather than on
      # when FortiSIEM saw the activity.
      alertDetectionDate: '{{ vars.item.alert_generation_epoch }}'
      eventTime: '{{ vars.item.last_observed_epoch }}'
      sourceIp: '{{ vars.item.source_ip }}'
      destinationIp: '{{ vars.item.dest_ip }}'
      destinationPort: '{{ vars.item.dest_port }}'
      hostName: '{{ vars.item.target_hostname or vars.item.dest_hostname }}'
      hostIPAddress: '{{ vars.item.target_ip or vars.item.reporting_ip }}'
      userName: '{{ vars.item.target_user or vars.item.source_user }}'
      rule: '{{ vars.item.rule_name }}'
      mitreattackid: '{{ vars.item.mitre_technique_ids | join(", ") }}'
      mitreTechnique: '{{ vars.item.mitre_technique_names | join(", ") }}'
      description: '{{ vars.item.description }}'
      # The full mapped incident, triggering events included, is kept here as
      # JSON rather than linked into the Events module -- one self-contained
      # record, no relationship to maintain. `source_payload` is the mapped
      # alert minus the rendered description, so `| toJSON` does not store that
      # HTML a second time. It must stay `| toJSON`: a bare `{{ }}` on
      # already-serialised JSON is stored as the literal string "Array".
      sourcedata: '{{ vars.item.source_payload | toJSON }}'
      __replace: 'true'
    next: Update Last Alert Pull Time

  - name: Update Last Alert Pull Time
    type: connector
    comment: |
      Advances the watermark only after the alerts are written, so a failed
      Create Record leaves the window to be retried.
    connector: cyops_utilities
    operation: updatemacro
    operationTitle: 'FSR: Update Global Variables'
    config: ''
    params:
      macro: '{{vars.FortiSIEMMacroName}}'
      value: '{{vars.steps.List_Incident.current_time}}'

name: release

# Tag `v6.0.4` builds the bundle for info.json version 6.0.4 and attaches it to
# a GitHub release. The tag is the trigger, but info.json stays the source of
# truth for the version -- the checks below refuse a tag that disagrees with it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match info.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          info=$(python3 -c "import json;print(json.load(open('info.json'))['version'])")
          if [ "$tag" != "$info" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match info.json version $info"
            exit 1
          fi
          echo "version=$info" >> "$GITHUB_ENV"

      - name: Compiled playbooks must match info.json version
        # playbooks.json is generated from playbooks.yaml by playbooks/build.py,
        # which needs the fsrpb compiler and so cannot run here. What CI can do
        # is refuse a release whose committed playbooks were built against an
        # older version -- a forgotten rebuild ships a bundle whose sample
        # collection is named for the previous release, and FortiSOAR deletes
        # and re-imports that collection by name on upgrade.
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          version = json.load(open("info.json"))["version"]
          name = json.load(open("playbooks/playbooks.json"))["data"][0]["name"]
          if not re.search(rf"{re.escape(version)}$", name):
              sys.exit(f"::error::playbooks.json collection {name!r} "
                       f"is not built for {version}; re-run playbooks/build.py")
          print(f"collection {name!r} matches {version}")
          PY

      - name: No en/em dashes
        # FortiSOAR loads connector source as latin-1 at runtime, so one of
        # these raises UnicodeEncodeError on an operation that is otherwise fine.
        run: |
          if git grep -nP '[\x{2013}\x{2014}]' -- . ; then
            echo "::error::en/em dash found -- use -- and -"
            exit 1
          fi

      - run: pip install -r tests/requirements.txt
      - run: pytest tests/test_offline.py -q
        continue-on-error: true   # offline suite has known pre-existing failures

      - name: Build the bundle
        run: ./scripts/package.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/fortinet-fortisiemv2-${version}.tgz" \
            --title "$GITHUB_REF_NAME" \
            --notes "Install in FortiSOAR: Content Hub > Connectors > Add, and upload the attached .tgz."
